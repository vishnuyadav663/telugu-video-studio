<!doctype html><html lang="te"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dronacharya — The Fall</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080b11}canvas{width:100%;height:100%;display:block}#cap{position:fixed;left:6%;right:6%;bottom:9%;text-align:center;color:#f3d6a4;font:700 clamp(20px,3vw,42px) Georgia,serif;line-height:1.35;text-shadow:0 3px 22px #000;opacity:0;letter-spacing:.02em}#tag{font:600 12px Arial,sans-serif;letter-spacing:.35em;color:#d7a86a;margin-bottom:18px}</style></head><body><canvas id="c"></canvas><div id="cap"><div id="tag"></div><div id="line"></div></div><script>
(()=>{const W=1080,H=1920,D=30,c=document.querySelector('#c'),x=c.getContext('2d'),cap=document.querySelector('#cap'),tag=document.querySelector('#tag'),line=document.querySelector('#line');c.width=W;c.height=H;
const scenes=[{a:0,b:8,k:'DAY FIFTEEN · KURUKSHETRA',t:'అజేయుడైన ద్రోణాచార్యుడు'},{a:8,b:18,k:'THE PSYCHOLOGICAL TURN',t:'“అశ్వత్థామ హతః…” అనే మాట యుద్ధాన్ని మార్చింది'},{a:18,b:25,k:'THE BREAKING POINT',t:'ధర్మరాజు మాట కోసం గురువు ఎదురుచూశాడు'},{a:25,b:30,k:'THE FINAL MOMENT',t:'ఆయుధాలు విడిచి ధ్యానంలోకి వెళ్లిన ఆచార్యుడు'}];
const p=Array.from({length:190},(_,i)=>({x:(i*157)%W,y:(i*283)%H,r:1+(i%4),v:.25+(i%7)*.12}));
const lerp=(a,b,t)=>a+(b-a)*Math.max(0,Math.min(1,t));const ease=t=>{t=Math.max(0,Math.min(1,t));return t*t*(3-2*t)};
function warrior(cx,cy,s,pose,color){x.save();x.translate(cx,cy);x.scale(s,s);x.fillStyle=color;x.strokeStyle='#c18a53';x.lineWidth=7;
if(pose==='sit'){x.beginPath();x.moveTo(-65,-210);x.lineTo(-100,-55);x.lineTo(-155,5);x.lineTo(-20,18);x.lineTo(0,-50);x.lineTo(70,15);x.lineTo(150,0);x.lineTo(60,-210);x.closePath();x.fill();}else{x.beginPath();x.moveTo(-58,-210);x.lineTo(-82,-5);x.lineTo(82,-5);x.lineTo(58,-210);x.closePath();x.fill();}
x.beginPath();x.arc(0,-260,48,0,Math.PI*2);x.fillStyle='#bd8056';x.fill();x.fillStyle='#e4d6bd';x.beginPath();x.arc(0,-286,48,Math.PI,Math.PI*2);x.fill();x.fillStyle='#b88948';x.beginPath();x.moveTo(-42,-300);x.lineTo(-28,-365);x.lineTo(0,-335);x.lineTo(28,-365);x.lineTo(42,-300);x.fill();x.restore();}
function chariot(cx,cy,s){x.save();x.translate(cx,cy);x.scale(s,s);x.fillStyle='#65432c';x.strokeStyle='#d5aa68';x.lineWidth=10;x.beginPath();x.moveTo(-180,-120);x.lineTo(180,-120);x.lineTo(150,0);x.lineTo(-150,0);x.closePath();x.fill();x.stroke();for(let q of [-112,112]){x.beginPath();x.arc(q,48,58,0,7);x.fillStyle='#111317';x.fill();x.strokeStyle='#c79551';x.stroke();}x.restore();}
window.DUR=D;window.EV=[{t:8.5,type:'whoosh'},{t:15.7,type:'thump'},{t:18.2,type:'low'},{t:25.5,type:'whoosh'},{t:28.8,type:'impact'}];
window.TEXTS=t=>{const s=scenes.find(z=>t>=z.a&&t<z.b);return s?[{id:'caption',text:s.t,x0:65,y0:1480,x1:1015,y1:1740}]:[]};
window.render=t=>{t=Math.max(0,Math.min(D,t));x.clearRect(0,0,W,H);let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0b1420');g.addColorStop(.5,'#5c3326');g.addColorStop(1,'#08090d');x.fillStyle=g;x.fillRect(0,0,W,H);
let sun=x.createRadialGradient(540,790,0,540,790,570);sun.addColorStop(0,'rgba(255,187,112,.75)');sun.addColorStop(1,'rgba(220,80,30,0)');x.fillStyle=sun;x.fillRect(0,150,W,1250);
x.fillStyle='#171719';x.beginPath();x.moveTo(0,1120);for(let i=0;i<=1080;i+=90)x.lineTo(i,1050+Math.sin(i*.02)*50);x.lineTo(W,H);x.lineTo(0,H);x.fill();
p.forEach((q,i)=>{let yy=(q.y-t*q.v*24+H*3)%(H);x.globalAlpha=.18+(i%5)*.04;x.fillStyle=i%4?'#f0a05a':'#ffe0a8';x.beginPath();x.arc((q.x+Math.sin(t+i)*18)%W,yy,q.r,0,7);x.fill();});x.globalAlpha=1;
for(let i=0;i<17;i++){let xx=i*72+20;x.fillStyle='#0b0d10';x.fillRect(xx,1050,8,260);x.beginPath();x.arc(xx,1040,17,0,7);x.fill();}
if(t<8){chariot(540,1510,1.15);warrior(540,1370,1.65,'stand','#713a2b');for(let i=0;i<8;i++){let xx=((t*250+i*170)%1450)-180;x.strokeStyle='#e8c78e';x.lineWidth=5;x.beginPath();x.moveTo(xx,620+i*65);x.lineTo(xx+130,590+i*65);x.stroke();}}
else if(t<18){warrior(270,1450,1.25,'stand','#28645d');warrior(525,1450,1.2,'stand','#885b36');chariot(270,1550,.8);x.fillStyle='#4c3a29';x.beginPath();x.ellipse(800,1480,155,85,0,0,7);x.fill();x.fillStyle='#a78b64';x.beginPath();x.ellipse(800,1410,135,90,0,0,7);x.fill();x.fillStyle='#f2d5a0';x.font='bold 42px Georgia';x.textAlign='center';x.fillText('ASHWATTHAMA IS DEAD',540,490);}
else if(t<25){x.fillStyle='rgba(0,0,0,.25)';x.fillRect(0,0,W,H);warrior(540,1470,1.9,'stand','#713a2b');let q=ease((t-18)/6);x.save();x.translate(0,q*220);x.rotate(q*.8);x.strokeStyle='#d4a45e';x.lineWidth=18;x.beginPath();x.arc(820,1320,170,-1.4,1.4);x.stroke();x.restore();warrior(170,1480,.9,'stand','#28645d');}
else{warrior(500,1480,1.8,'sit','#75402d');let q=ease((t-25)/4);x.save();x.globalAlpha=q;x.translate(560-q*80,0);warrior(930,1460,1.2,'stand','#562b24');x.strokeStyle='#e7e0d1';x.lineWidth=20;x.beginPath();x.moveTo(900,1210);x.lineTo(790,850);x.stroke();x.restore();x.fillStyle='rgba(255,225,180,'+(Math.max(0,1-Math.abs(t-28.8)*3)*.65)+')';x.fillRect(0,0,W,H);}
const s=scenes.find(z=>t>=z.a&&t<z.b);if(s){tag.textContent=s.k;line.textContent=s.t;cap.style.opacity=Math.min(1,(t-s.a)*2,(s.b-t)*2);}else cap.style.opacity=0;
};window.READY=true;window.render(0);
})();</script></body></html>
