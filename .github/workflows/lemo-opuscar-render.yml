name: Lemo-Opuscar Dronacharya Film
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout video project
        uses: actions/checkout@v4
      - name: Set up Node and Python
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FFmpeg 7+
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y wget xz-utils
          mkdir -p "$RUNNER_TEMP/ffmpeg"
          wget -q https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz -O "$RUNNER_TEMP/ffmpeg.tar.xz"
          tar -xJf "$RUNNER_TEMP/ffmpeg.tar.xz" -C "$RUNNER_TEMP/ffmpeg"
          FFMPEG_BIN="$(find "$RUNNER_TEMP/ffmpeg" -type f -name ffmpeg -perm -111 | head -n 1)"
          FFPROBE_BIN="$(find "$RUNNER_TEMP/ffmpeg" -type f -name ffprobe -perm -111 | head -n 1)"
          test -n "$FFMPEG_BIN" && test -n "$FFPROBE_BIN"
          sudo install -m 755 "$FFMPEG_BIN" /usr/local/bin/ffmpeg
          sudo install -m 755 "$FFPROBE_BIN" /usr/local/bin/ffprobe
          ffmpeg -version
      - name: Clone Lemo-Opuscar engine
        run: git clone --depth 1 https://github.com/lemomo-ai/lemo-opuscar.git .lemo-opuscar
      - name: Render complete film with Lemo-Opuscar
        shell: bash
        run: |
          set -euo pipefail
          export LIB="$GITHUB_WORKSPACE/.lemo-opuscar"
          bash films/dronacharya/build.sh
      - name: Upload finished MP4 and review stills
        uses: actions/upload-artifact@v4
        with:
          name: dronacharya-lemo-opuscar-film
          path: |
            films/dronacharya/out/dronacharya-telugu.mp4
            films/dronacharya/out/stills/
          if-no-files-found: error
          retention-days: 7
