name: Render Telugu Short

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Telugu fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core

      - name: Download narration audio
        run: |
          mkdir -p public/audio
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://d2ol7oe51mr4n9.cloudfront.net/user_3KWwnEguYrcZm3Fs6HIAoQBn5dP/c75943b5-fe2b-4962-8e13-5e9b657a007f.mp3" \
            --output public/audio/voiceover.mp3
          test -s public/audio/voiceover.mp3
          file public/audio/voiceover.mp3

      - name: Install project dependencies
        run: npm install

      - name: Ensure Remotion browser
        run: npx remotion browser ensure

      - name: Render vertical Short
        run: |
          mkdir -p out
          npx remotion render src/index.tsx TeluguShort out/telugu-short.mp4 --codec=h264

      - name: Upload MP4
        uses: actions/upload-artifact@v4
        with:
          name: telugu-short-video
          path: out/telugu-short.mp4
          if-no-files-found: error
          retention-days: 7
